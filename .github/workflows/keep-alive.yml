name: Keep backend awake

# Supabase's free plan pauses a project after about a week without activity. A daily health
# check (which queries the database) keeps it awake. Inactive until the repository variable
# GAME_API_HEALTH_URL is set (Settings → Secrets and variables → Actions → Variables).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.GAME_API_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 "${{ vars.GAME_API_HEALTH_URL }}"
