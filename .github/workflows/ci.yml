name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make setup
      # Lint, types, unit/component (and Makefile) tests, build: the same command as locally.
      - run: make check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make setup
      - run: npx playwright install --with-deps chromium
      # Shared-play journeys run two browser contexts against a fresh local backend.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      - run: make up
      # No report or trace upload: they would contain device credentials and invitation tokens.
      - run: make e2e
      # The site repeats a failed read, so a 500 can hide behind a passing journey. Report what
      # the backend logged; this job does not fail on it (#116).
      - if: ${{ !cancelled() }}
        run: make backend-errors BACKEND_ERRORS_FLAGS=--report-only

  # Real-backend integration tests: a fresh local Supabase stack with the repository's
  # migrations applied and the game-api function served. No cloud project or secrets involved.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make setup
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      - run: make up
      - run: make test-backend
      # Whether the tests passed or not (#116): every unexpected error the function logged during
      # the whole run, by route and error, never bodies. It expects the diagnostics test's one
      # deliberate failure and fails the job on any other, so a 500 cannot pass unnoticed.
      - if: ${{ !cancelled() }}
        run: make backend-errors
